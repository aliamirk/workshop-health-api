<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Health</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262a33;
    --text: #e6e8eb;
    --muted: #8b909a;
    --accent: #3ddc84;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }
  .card {
    width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .row:last-child { border-bottom: none; }
  .label { color: var(--muted); }
  .value { font-weight: 500; text-align: right; }
  .hostname-block {
    background: rgba(61, 220, 132, 0.08);
    border: 1px solid rgba(61, 220, 132, 0.35);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 16px;
    text-align: center;
  }
  .hostname-label {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .hostname-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
  }
  .footer {
    margin-top: 18px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
  .error { color: #e05252; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>System Health</h1>
      <span class="badge"><span class="dot"></span>live</span>
    </div>
    <div id="content">Loading...</div>
  </div>

<script>
async function loadStatus() {
  const content = document.getElementById('content');
  try {
    const res = await fetch('/status');
    const data = await res.json();
    content.innerHTML = `
      <div class="hostname-block">
        <div class="hostname-label">Hostname</div>
        <div class="hostname-value">${data.hostname}</div>
      </div>
      <div class="row"><span class="label">Status</span><span class="value">${data.status}</span></div>
      <div class="row"><span class="label">Uptime</span><span class="value">${data.uptime}</span></div>
      <div class="row"><span class="label">Memory</span><span class="value">${data.memory.free} free / ${data.memory.total}</span></div>
      <div class="row"><span class="label">CPU Cores</span><span class="value">${data.cpu_cores}</span></div>
      <div class="row"><span class="label">Subnet</span><span class="value">${data.network.subnet_id ?? 'n/a'}</span></div>
      <div class="row"><span class="label">Availability Zone</span><span class="value">${data.network.availability_zone ?? 'n/a'}</span></div>
      <div class="row"><span class="label">Timestamp</span><span class="value">${data.timestamp}</span></div>
    `;
  } catch (e) {
    content.innerHTML = '<div class="error">Unable to reach /status</div>';
  }
}
loadStatus();
</script>
</body>
</html>
